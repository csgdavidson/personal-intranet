<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel | Charlie HQ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .subtitle {
      margin: 8px 0 0;
      opacity: 0.7;
    }

    .back-link {
      color: #e6e6e6;
      text-decoration: none;
      border: 1px solid #2a2f38;
      border-radius: 10px;
      padding: 10px 14px;
      background: #1a1d23;
    }

    .back-link:hover {
      border-color: #3a404c;
    }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot-been {
      background: #4ade80;
    }

    .dot-want {
      background: #60a5fa;
    }

    .stats {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #1a1d23;
      border: 1px solid #2a2f38;
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 120px;
    }

    .stat-number {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    #map {
      height: 620px;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #2a2f38;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #1a1d23;
      color: #e6e6e6;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-meta {
      opacity: 0.8;
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      #map {
        height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>Travel</h1>
        <p class="subtitle">Places I've been and places I want to go</p>
      </div>
      <a class="back-link" href="index.html">← Back to dashboard</a>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="dot dot-been"></span>
        <span>Been</span>
      </div>
      <div class="legend-item">
        <span class="dot dot-want"></span>
        <span>Want to go</span>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div id="map"></div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    const places = [
      { name: "Athens", lat: 37.9838, lng: 23.7275, status: "been" },
      { name: "Bali", lat: -8.4095, lng: 115.1889, status: "want" },
      { name: "Bangkok", lat: 13.7563, lng: 100.5018, status: "want" },
      { name: "Barcelona", lat: 41.3874, lng: 2.1686, status: "been" },
      { name: "Berlin", lat: 52.5200, lng: 13.4050, status: "want" },
      { name: "Boston", lat: 42.3601, lng: -71.0589, status: "want" },
      { name: "Buenos Aires", lat: -34.6037, lng: -58.3816, status: "want" },
      { name: "Budapest", lat: 47.4979, lng: 19.0402, status: "want" },
      { name: "Cape Town", lat: -33.9249, lng: 18.4241, status: "want" },
      { name: "Chicago", lat: 41.8781, lng: -87.6298, status: "want" },
      { name: "Dubai", lat: 25.2048, lng: 55.2708, status: "want" },
      { name: "Florence", lat: 43.7696, lng: 11.2558, status: "been" },
      { name: "Grand Canyon", lat: 36.1069, lng: -112.1129, status: "want" },
      { name: "Great Barrier Reef", lat: -18.2871, lng: 147.6992, status: "want" },
      { name: "Hong Kong", lat: 22.3193, lng: 114.1694, status: "want" },
      { name: "Istanbul", lat: 41.0082, lng: 28.9784, status: "want" },
      { name: "Kyoto", lat: 35.0116, lng: 135.7681, status: "want" },
      { name: "Lisbon", lat: 38.7223, lng: -9.1393, status: "been" },
      { name: "Los Angeles", lat: 34.0549, lng: -118.2426, status: "want" },
      { name: "Machu Picchu", lat: -13.1631, lng: -72.5450, status: "want" },
      { name: "Madrid", lat: 40.4168, lng: -3.7038, status: "want" },
      { name: "Marrakech", lat: 31.6295, lng: -7.9811, status: "want" },
      { name: "New Orleans", lat: 29.9511, lng: -90.0715, status: "want" },
      { name: "New York City", lat: 40.7128, lng: -74.0060, status: "been" },
      { name: "Norwegian Fjords", lat: 60.9990, lng: 6.7553, status: "want" },
      { name: "Paris", lat: 48.8566, lng: 2.3522, status: "want" },
      { name: "Petra", lat: 30.3285, lng: 35.4444, status: "want" },
      { name: "Prague", lat: 50.0755, lng: 14.4378, status: "been" },
      { name: "Queenstown", lat: -45.0312, lng: 168.6626, status: "want" },
      { name: "Reykjavik", lat: 64.1466, lng: -21.9426, status: "want" },
      { name: "Rio de Janeiro", lat: -22.9068, lng: -43.1729, status: "want" },
      { name: "Rome", lat: 41.9028, lng: 12.4964, status: "been" },
      { name: "San Francisco", lat: 37.7749, lng: -122.4194, status: "want" },
      { name: "Santorini", lat: 36.3932, lng: 25.4615, status: "want" },
      { name: "Seattle", lat: 47.6061, lng: -122.3328, status: "want" },
      { name: "Seoul", lat: 37.5665, lng: 126.9780, status: "want" },
      { name: "Serengeti", lat: -2.3333, lng: 34.8333, status: "want" },
      { name: "Shanghai", lat: 31.2304, lng: 121.4737, status: "want" },
      { name: "Singapore", lat: 1.3521, lng: 103.8198, status: "want" },
      { name: "Sydney", lat: -33.8688, lng: 151.2093, status: "want" },
      { name: "Tokyo", lat: 35.6762, lng: 139.6503, status: "want" },
      { name: "Toronto", lat: 43.6532, lng: -79.3832, status: "want" },
      { name: "Vancouver", lat: 49.2827, lng: -123.1207, status: "want" },
      { name: "Venice", lat: 45.4408, lng: 12.3155, status: "want" },
      { name: "Vienna", lat: 48.2082, lng: 16.3738, status: "want" },
      { name: "Washington DC", lat: 38.9072, lng: -77.0369, status: "want" },
      { name: "Yosemite National Park", lat: 37.8651, lng: -119.5383, status: "want" }
    ];

    const totalPlaces = places.length;
    const beenPlaces = places.filter(p => p.status === "been").length;
    const wantPlaces = places.filter(p => p.status === "want").length;

    document.getElementById("stats").innerHTML = `
      <div class="stat-card">
        <div class="stat-number">${totalPlaces}</div>
        <div class="stat-label">Total places</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">${beenPlaces}</div>
        <div class="stat-label">Visited</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">${wantPlaces}</div>
        <div class="stat-label">Want to go</div>
      </div>
    `;

    const map = L.map("map", { worldCopyJump: true }).setView([25, 10], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    function getColor(status) {
      return status === "been" ? "#4ade80" : "#60a5fa";
    }

    places.forEach(place => {
      const marker = L.circleMarker([place.lat, place.lng], {
        radius: 8,
        fillColor: getColor(place.status),
        color: "#0f1115",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      marker.bindPopup(`
        <div class="popup-title">${place.name}</div>
        <div class="popup-meta">${place.status === "been" ? "Been" : "Want to go"}</div>
      `);
    });
  </script>
</body>
</html>
