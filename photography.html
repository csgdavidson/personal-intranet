<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography | Charlie HQ</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .subtitle {
      margin-top: 6px;
      opacity: 0.6;
    }

    .back-link {
      text-decoration: none;
      color: #e6e6e6;
      border: 1px solid #2a2f38;
      padding: 10px 14px;
      border-radius: 10px;
      background: #1a1d23;
    }

    .back-link:hover {
      border-color: #3a404c;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #1a1d23;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(110%);
      transition: 0.3s ease;
    }

    .photo:hover img {
      transform: scale(1.05);
      filter: grayscale(100%) contrast(120%);
    }

    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      font-size: 0.85rem;
      opacity: 0;
      transition: 0.2s ease;
    }

    .photo:hover .caption {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="topbar">
      <div>
        <h1>Photography</h1>
        <div class="subtitle">Black & white explorations</div>
      </div>
      <a class="back-link" href="index.html">← Back to dashboard</a>
    </div>

    <div class="gallery">

      <div class="photo">
        <img src="assets/photos/stairs.jpg">
        <div class="caption">Oxford, UK</div>
      </div>

      <div class="photo">
        <img src="assets/photos/ardley.JPG">
        <div class="caption">Ardley, UK</div>
      </div>
      
    </div>
  </div>

</body>
</html>
